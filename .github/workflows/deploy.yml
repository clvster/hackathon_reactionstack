name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          BRANCH: ${{ github.ref_name }}
          SERVICES: db backend frontend
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BRANCH,SERVICES
          script: |
            set -e
            if [ "$BRANCH" = "main" ]; then ENV_NAME=prod; else ENV_NAME=dev; fi
            cd /opt/reactionstack/$ENV_NAME
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cd infra
            docker compose -p rs-$ENV_NAME up -d --build --no-deps --remove-orphans $SERVICES
            docker image prune -f
            docker compose -p rs-$ENV_NAME ps
