name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.m.outputs.env }}
      registry: ${{ steps.m.outputs.registry }}
    steps:
      - id: m
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend, notifier]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ needs.meta.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
            ${{ needs.meta.outputs.registry }}/${{ matrix.service }}:${{ needs.meta.outputs.env }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.meta.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/docker-compose.yml
          target: /opt/reactionstack/${{ needs.meta.outputs.env }}
          strip_components: 1
      - uses: appleboy/ssh-action@v1
        env:
          ENV_NAME: ${{ needs.meta.outputs.env }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ needs.meta.outputs.registry }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_NAME,IMAGE_TAG,REGISTRY,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/reactionstack/$ENV_NAME
            touch .env
            for kv in "IMAGE_TAG=$IMAGE_TAG" "REGISTRY=$REGISTRY"; do
              key="${kv%%=*}"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${kv}|" .env
              else
                echo "$kv" >> .env
              fi
            done
            echo "$(date -u +%FT%TZ) $IMAGE_TAG" >> deploy-history.log
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p rs-$ENV_NAME pull
            docker compose -p rs-$ENV_NAME up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
